<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}LavCust{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <div class="logo">
            🌱 LavCust
        </div>

        <nav>

            <a href="{{ url_for('index') }}">
                Início
            </a>

            <a href="{{ url_for('cadastro') }}">
                Cadastrar custo
            </a>

            <a href="{{ url_for('custos') }}">
                Custos
            </a>

            <a href="{{ url_for('relatorio') }}">
                Relatório
            </a>

        </nav>

    </header>


    <main>

        {% block content %}
        {% endblock %}

    </main>


    <footer>

        <p>
            LavCust — Controle de custos de produção agrícola
        </p>

    </footer>

</body>

</html>
