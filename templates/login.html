{% extends "auth_base.html" %}
{% block title %}Login{% endblock %}
{% block auth_content %}
<span class="eyebrow">ACESSO SEGURO</span>
<h2>Bem-vindo de volta</h2>
<p class="muted">Entre para acompanhar sua lavoura.</p>
<form method="post" class="form-grid">
  <label>E-mail<input type="email" name="email" required autocomplete="email" placeholder="seu@email.com"></label>
  <label>Senha<input type="password" name="password" required autocomplete="current-password"
      placeholder="Sua senha"></label>
  <div class="forgot"><a href="{{ url_for('forgot_password') }}">Esqueceu a senha?</a></div>
  <button class="btn btn-primary full" type="submit">Entrar no LavCust</button>
</form>
<p class="auth-bottom">Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar cadastro</a></p>
{% endblock %}
