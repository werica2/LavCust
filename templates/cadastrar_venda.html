{% extends "base.html" %}

{% block title %}Registrar Venda — LavCust{% endblock %}

{% block content %}

<div class="pagina">

    <div class="pagina-banner">

        <div>

            <img src="{{ url_for('static', filename='logo.png') }}"
                 alt="LavCust">

            <h1>Registrar Venda</h1>

            <p>
                Informe os dados da sua venda de produção.
            </p>

        </div>

    </div>


    <div class="form-container">

        <h1>Registrar Venda</h1>

        <p class="descricao-pagina">
            Informe os dados da venda da sua produção.
        </p>


        <form method="POST"
              class="form-grid">


            <div class="campo">

                <label>Quantidade de sacas</label>

                <input
                    type="number"
                    name="quantidade_sacas"
                    step="0.01"
                    min="0"
                    placeholder="0,00"
                    required>

            </div>


            <div class="campo">

                <label>Preço por saca (R$)</label>

                <input
                    type="number"
                    name="preco_por_saca"
                    step="0.01"
                    min="0"
                    placeholder="0,00"
                    required>

            </div>


            <div class="campo">

                <label>Data da venda</label>

                <input
                    type="date"
                    name="data"
                    required>

            </div>


            <div class="campo">

                <label>Produto</label>

                <select name="produto">

                    <option value="">
                        Selecione
                    </option>

                    <option value="Soja">
                        Soja
                    </option>

                    <option value="Milho">
                        Milho
                    </option>

                </select>

            </div>


            <div class="campo campo-full">

                <label>Observações</label>

                <textarea
                    name="observacoes"
                    placeholder="Informações adicionais (opcional)">
                </textarea>

            </div>


            <div class="acoes-form">

                <button type="reset"
                        class="btn-secundario">
                    Limpar
                </button>

                <button type="submit"
                        class="btn-principal">
                    Salvar Venda
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
