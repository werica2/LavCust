{% extends "auth_base.html" %}
{% block title %}Recuperar senha{% endblock %}
{% block auth_content %}
<span class="eyebrow">RECUPERAÇÃO DE ACESSO</span>
<h2>Esqueceu a senha?</h2>
<p class="muted">Informe seu e-mail para receber as instruções de recuperação.</p>
<form method="post" class="form-grid">
  <label>E-mail<input type="email" name="email" required placeholder="seu@email.com"></label>
  <button class="btn btn-primary full" type="submit">Continuar</button>
</form>
<p class="auth-bottom"><a href="{{ url_for('login') }}">Voltar para o login</a></p>
{% endblock %}
