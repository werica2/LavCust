{% extends "base.html" %}
{% block title %}Receita estimada{% endblock %}
{% block content %}
<div class="container page narrow">
  <div class="page-title">
    <span class="eyebrow">PLANEJAMENTO DA PRODUÇÃO</span>
    <h1>Receita estimada</h1>
    <p>Informe sua previsão de produção e o preço esperado por saca.</p>
  </div>

  <form method="post" class="panel form-grid two">
    <label>Cultura *
      <select name="culture" required>
        <option value="">Selecione</option>
        {% for c in cultures %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </label>

    <label>Safra *
      <input name="harvest" required placeholder="Ex.: 2026/2027">
    </label>

    <label>Quantidade prevista de sacas *
      <input id="bags" type="number" name="expected_bags"
             min="0.01" step="0.01" required>
    </label>

    <label>Preço previsto por saca (R$) *
      <input id="price" type="number" name="expected_price"
             min="0" step="0.01" required>
    </label>

    <div class="sale-preview">
      <span>Receita estimada</span>
      <strong id="estimate-total">R$ 0,00</strong>
    </div>

    <div class="form-actions full-row">
      <a class="btn btn-outline" href="{{ url_for('dashboard') }}">Cancelar</a>
      <button class="btn btn-primary" type="submit">Salvar previsão</button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
const bags = document.getElementById("bags");
const price = document.getElementById("price");
const total = document.getElementById("estimate-total");

function calcular() {
  const valor = Number(bags.value || 0) * Number(price.value || 0);
  total.textContent = valor.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}
bags.addEventListener("input", calcular);
price.addEventListener("input", calcular);
</script>
{% endblock %}
