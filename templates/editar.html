{% extends "base.html" %}

{% block title %}
Editar custo - LavCust
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>Editar custo</h1>

    <form method="POST">

        <label>
            Lavoura
        </label>

        <select name="lavoura" required>

            <option value="Soja"
                {% if custo["lavoura"] == "Soja" %}selected{% endif %}>
                Soja
            </option>

            <option value="Milho"
                {% if custo["lavoura"] == "Milho" %}selected{% endif %}>
                Milho
            </option>

        </select>

        <label>
            Categoria
        </label>

        <select name="categoria" required>

            {% for categoria in [
                "Sementes",
                "Fertilizantes",
                "Defensivos",
                "Combustível",
                "Máquinas",
                "Mão de obra",
                "Outros"
            ] %}

            <option value="{{ categoria }}"
                {% if custo["categoria"] == categoria %}
                    selected
                {% endif %}>
                {{ categoria }}
            </option>

            {% endfor %}

        </select>

        <label>
            Descrição
        </label>

        <input
            type="text"
            name="descricao"
            value="{{ custo['descricao'] }}"
            required
        >

        <label>
            Quantidade
        </label>

        <input
            type="number"
            name="quantidade"
            step="0.01"
            value="{{ custo['quantidade'] }}"
            required
        >

        <label>
            Valor unitário (R$)
        </label>

        <input
            type="number"
            name="valor"
            step="0.01"
            value="{{ custo['valor'] }}"
            required
        >

        <button type="submit">
            Salvar alterações
        </button>

    </form>

</div>

{% endblock %}
