<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LavCust - Editar Despesa</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #eef5ed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 500px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✏️ Editar Despesa</h1>

    <form method="POST">

        <label>Descrição</label>
        <input
            type="text"
            name="descricao"
            value="{{ despesa.descricao }}"
            required
        >

        <label>Categoria</label>
        <input
            type="text"
            name="categoria"
            value="{{ despesa.categoria }}"
            required
        >

        <label>Valor</label>
        <input
            type="number"
            step="0.01"
            name="valor"
            value="{{ despesa.valor }}"
            required
        >

        <label>Data</label>
        <input
            type="text"
            name="data"
            value="{{ despesa.data }}"
            required
        >

        <label>Safra</label>
        <input
            type="text"
            name="safra"
            value="{{ despesa.safra }}"
            required
        >

        <button type="submit">
            Salvar alterações
        </button>

    </form>

    <a href="/despesas">← Voltar para despesas</a>

</div>

</body>
</html>
