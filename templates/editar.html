{% extends "base.html" %}
{% block title %}Editar despesa{% endblock %}
{% block content %}
<div class="container page narrow">
<div class="page-title"><span class="eyebrow">CONTROLE DE CUSTOS</span><h1>Editar despesa</h1></div>
<form method="post" class="panel form-grid two">
<label>Cultura *<select name="culture" required>{% for c in cultures %}<option {% if expense['culture']==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label>
<label>Safra *<input name="harvest" value="{{ expense['harvest'] }}" required></label>
<label>Categoria *<select name="category" required>{% for c in categories %}<option {% if expense['category']==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></label>
<label>Data *<input type="date" name="expense_date" value="{{expense['expense_date']}}" required></label>
<label>Valor gasto (R$) *<input type="number" name="amount" step="0.01" min="0" value="{{expense['amount']}}" required></label>
<label>Valor previsto (R$)<input type="number" name="planned_amount" step="0.01" min="0" value="{{expense['planned_amount']}}"></label>
<label class="full-row">Descrição<textarea name="description" rows="4">{{expense['description'] or ''}}</textarea></label>
<div class="form-actions full-row"><a class="btn btn-outline" href="{{url_for('despesas')}}">Cancelar</a><button class="btn btn-primary">Salvar alterações</button></div>
</form></div>
{% endblock %}
