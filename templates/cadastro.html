{% extends "auth_base.html" %}
{% block title %}Cadastro{% endblock %}
{% block auth_content %}
<span class="eyebrow">PRIMEIRO ACESSO</span>
<h2>Crie sua conta</h2>
<p class="muted">Comece a organizar sua produção com o LavCust.</p>
<form method="post" class="form-grid">
  <label>Nome completo<input name="name" required autocomplete="name" placeholder="Seu nome"></label>
  <label>E-mail<input type="email" name="email" required autocomplete="email" placeholder="seu@email.com"></label>
  <label>Senha<input type="password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres e 1 número"></label>
  <label>Confirmar senha<input type="password" name="confirm_password" required minlength="8" placeholder="Repita sua senha"></label>
  <button class="btn btn-primary full" type="submit">Criar minha conta</button>
</form>
<p class="auth-bottom">Já possui uma conta? <a href="{{ url_for('login') }}">Entrar</a></p>
{% endblock %}
