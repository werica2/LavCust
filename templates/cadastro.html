<!DOCTYPE html>
<html lang="pt-BR">

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f1f8f4;
        color: #26352c;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: first baseline;
        padding: 30px;
    }

    .container {
        background: white;
        width: 100%;
        max-width: 600px;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
        color: #218c5a;
        margin-bottom: 10px;
        text-align: normal;
    }

    p {
        text-align: center;
        color: #6b756f;
        margin-bottom: 25px;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    label {
        font-weight: 700;
        color: #34443a;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #cfd8d2;
        border-radius: 8px;
        font-size: 15px;
        margin-top: 6px;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: #218c5a;
        box-shadow: 0 0 0 3px rgba(33, 140, 90, 0.12);
    }

    button {
        background: #218c5a;
        color: white;
        border: none;
        padding: 13px;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background: #176b43;
    }
</style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LavCust - Cadastro de Despesa</title>
</head>
<body>

    <h1>Cadastro de Despesa</h1>

    <form>
        <label for="descricao">Descrição da despesa:</label>
        <input type="text" id="descricao" name="descricao" required>

        <br><br>

        <label for="categoria">Categoria:</label>
        <select id="categoria" name="categoria" required>
            <option value="">Selecione</option>
            <option value="sementes">Sementes</option>
            <option value="fertilizantes">Fertilizantes</option>
            <option value="defensivos">Defensivos agrícolas</option>
            <option value="combustivel">Combustível</option>
            <option value="manutencao">Manutenção</option>
            <option value="mao_de_obra">Mão de obra</option>
            <option value="transporte">Transporte</option>
            <option value="outros">Outros</option>
        </select>

        <br><br>

        <label for="valor">Valor:</label>
        <input type="number" id="valor" name="valor" step="0.01" required>

        <br><br>

        <label for="data">Data:</label>
        <input type="date" id="data" name="data" required>

        <br><br>

        <label for="safra">Safra:</label>
        <select id="safra" name="safra" required>
            <option value="">Selecione</option>
            <option value="Soja 2026">Soja 2026</option>
            <option value="Milho 2026">Milho 2026</option>
        </select>

        <br><br>

        <button type="submit">Cadastrar despesa</button>
    </form>

</body>
</html>
